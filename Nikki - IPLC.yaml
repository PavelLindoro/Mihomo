# =========================================================
# 锚点 - 出站策略
Sele: &Sele {type: select, include-all: true, hidden: false, health-check: *health, url: https://bat.bing.com/action/0}
Auto: &Auto {type: url-test, include-all: true, hidden: false, health-check: *health, url: https://bat.bing.com/action/0}
Faba: &Faba {type: fallback, include-all: false, hidden: false, health-check: *health, url: https://bat.bing.com/action/0}
load: &load {type: load-balance, strategy: round-robin, include-all: true, hidden: false, health-check: *health, url: https://bat.bing.com/action/0}

# =========================================================
# 锚点 - 规则分组锚点
PG1: &PG1 {type: select, proxies: [香港优选, 台湾优选, 日本优选, 韩国优选, 狮城优选, 美国优选, 东南自动, 澳洲自动, 北美自动, 南美自动, 西欧自动, 中欧自动, 原生手动, 原生自动, 其他手动, 全部自动, 🔰 直连]}
PG2: &PG2 {type: select, proxies: [默认代理, 香港优选, 台湾优选, 日本优选, 韩国优选, 狮城优选, 美国优选, 东南自动, 澳洲自动, 北美自动, 南美自动, 西欧自动, 中欧自动, 原生手动, 原生自动, 其他手动, 全部自动, 🔰 直连]}
