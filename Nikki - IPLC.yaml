# 规则集锚点
rule-anchor:
  ipci: &ipci {type: http, interval: 21600, behavior: ipcidr, format: mrs}
  doma: &doma {type: http, interval: 21600, behavior: domain, format: mrs}
  clas: &clas {type: http, interval: 21600, behavior: classical, format: yaml}
  list: &list {type: http, interval: 21600, behavior: classical, format: text}

# =========================================================
# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "/etc/nikki/run"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

# =========================================================
# 订阅节点
proxy-providers: 
  IPLC机场:
    url: 
    type: http
    interval: 21600
    subscription-info: true
    health-check: *health
    proxy: 全部自动
    override:
      udp: true
      additional-suffix: " | IPLC"
    exclude-filter: "尼|官 网|海外" 

  POLY机场:
    url: 
    type: http
    interval: 21600
    subscription-info: true
    health-check: *health
    proxy: 全部自动
    override:
      udp: true
      additional-suffix: " | POLY"
    exclude-filter: "官网|倍率|推荐|流量|套餐"

  YST-机场:
    url: 
    type: http
    interval: 21600
    subscription-info: true
    health-check: *health
    proxy: 全部自动
    override:
      udp: true
      additional-suffix: " | -YST"
    exclude-filter: "剩余|到期"

proxies: # 节点列表
  - {name: 🔰 直连, type: direct}
  - {name: 🚫 拒绝, type: reject}


# =========================================================
# 全局
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
udp: true                                                           # 显式开启 UDP 支持
mode: rule                                                          # 运行模式：rule 规则匹配；global 全局代理；direct 全局直连
ipv6: false                                                         # 全局 IPv6 支持（全局网络栈）
allow-lan: true                                                     # 允许局域网连接
bind-address: "*"                                                   # 监听所有地址（会监听所有网卡地址，公网环境下可能带来安全风险，请谨慎使用）
log-level: warning                                                  # 日志等级（可选：debug, info, warning, error）
unified-delay: true                                                 # 启用统一延迟（用于统一延迟计算，提升测速准确性）
tcp-concurrent: true                                                # 启用 TCP 并发连接，允许多个 TCP 连接同时建立，提升连接效率
client-fingerprint: chrome                                          # 全局客户端指纹
disable-keep-alive: false                                           # 是否禁用 HTTP Keep-Alive 功能，禁用后每个 HTTP 请求都会建立新的连接
keep-alive-idle: 600                                                # Keep-Alive 空闲超时时间，单位为秒
keep-alive-interval: 15                                             # Keep-Alive 的发送间隔，单位为秒
profile:
  store-selected: true                                              # 启用已选配置文件存储，确保在切换配置文件时能够自动记住并恢复上次使用的配置文件，提升用户体验
  store-fake-ip: true                                               # 启用 Fake IP 存储，确保在切换配置文件时能够保留已分配的 Fake IP 地址，避免因 Fake IP 变化导致的访问异常

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:                                        # 绕过指定 IP 段，不进入内核处理
    - CN_ip                                                        # 中国大陆 IP 段
    - Cn_ip                                                        # 中国大陆 IP 段（备用）
  
# 嗅探模块
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:                                                   # 黑名单模式的 Fake IP 过滤规则，确保这些域名不会被分配 Fake IP，直接使用系统 DNS 解析，提升访问速度和稳定性
    - "rule-set:Fakeipfilter"
    
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://8.8.8.8/dns-query#全部自动
    - https://9.9.9.9/dns-query#全部自动

