# =========================================================
# 锚点 - 节点筛选组
AIR2-HK: &AIR2-HK '(?ix)(?=.*(?:IPLC|POLY))(?=.*(?:香港|\bHK\d*|Hong\s?Kong))' 
YST--HK: &YST--HK '(?ix)(?=.*-YST)(?=.*(?:香港|\bHK\d*|Hong\s?Kong))'
# ALL--HK: &ALL--HK '(?ix)(?=.*(?:IPLC|POLY|-YST))(?=.*(?:香港|\bHK\d*|Hong\s?Kong))'

AIR2-TW: &AIR2-TW '(?ix)(?=.*(?:IPLC|POLY))(?=.*(?:台湾|台灣|\bTW\d*|Taiwan))'
YST--TW: &YST--TW '(?ix)(?=.*-YST)(?=.*(?:台湾|台灣|\bTW\d*|Taiwan))'
# ALL--TW: &ALL--TW '(?ix)(?=.*(?:IPLC|POLY|-YST))(?=.*(?:台湾|台灣|\bTW\d*|Taiwan))'

AIR2-JP: &AIR2-JP '(?ix)(?=.*(?:IPLC|POLY))(?=.*(?:日本|\bJP\d*|Japan))'
YST--JP: &YST--JP '(?ix)(?=.*-YST)(?=.*(?:日本|\bJP\d*|Japan))'
# ALL--JP: &ALL--JP '(?ix)(?=.*(?:IPLC|POLY|-YST))(?=.*(?:日本|\bJP\d*|Japan))'

AIR2-SG: &AIR2-SG '(?ix)(?=.*(?:IPLC|POLY))(?=.*(?:新加坡|\bSG\d*|Singapore))'
YST--SG: &YST--SG '(?ix)(?=.*-YST)(?=.*(?:新加坡|\bSG\d*|Singapore))'
# ALL--SG: &ALL--SG '(?ix)(?=.*(?:IPLC|POLY|-YST))(?=.*(?:新加坡|\bSG\d*|Singapore))'

AIR2-US: &AIR2-US '(?ix)(?=.*(?:IPLC|POLY))(?=.*(?:美国|United\s?States))'   # |\bUS\d*|
YST--US: &YST--US '(?ix)(?=.*-YST)(?=.*(?:美国|\bUS\d*|United\s?States))'
# ALL--US: &ALL--US '(?ix)(?=.*(?:IPLC|POLY|-YST))(?=.*(?:美国|\bUS\d*|United\s?States))'

YSJT--SD: &YSJT--SD '(?i)(?=.*(?:原生))(?!.*(?:直连|拒绝))'
ALL--KR: &ALL--KR '(?ix)(?=.*(?:IPLC|POLY|-YST))(?=.*(?:韩国|\bKR\d*|Korea))'

